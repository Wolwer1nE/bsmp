[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsmp"
version = "0.1.0"
description = "Python scripts and cmdlets for BSMP project"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vladislav Krylov", email = "vvkrylov1@gmail.com" }]
dependencies = [
    "click"
]

[project.optional-dependencies]
dev = [
    "pytest", # Right now no need for this
    "ruff"
] 

[project.scripts]
bsmp = "bsmp.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 80
target-version = ['py312']

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"